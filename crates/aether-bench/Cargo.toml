[package]
name = "aether-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "aether-bench"
path = "src/main.rs"

[[bin]]
name = "aether-agent-bench"
path = "src/agent_bench.rs"

[dependencies]
aether-core = { path = "../aether-core" }
aether-storage = { path = "../aether-storage" }
aether-txn = { path = "../aether-txn" }
aether-simd = { path = "../aether-simd" }
aether-vector = { path = "../aether-vector" }
aether-network = { path = "../aether-network" }
tokio = { workspace = true, features = ["full"] }
clap = { workspace = true, features = ["derive"] }
rand.workspace = true
tempfile.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
