[workspace]
resolver = "2"
members = [
    "crates/aether-core",
    "crates/aether-storage",
    "crates/aether-simd",
    "crates/aether-raft",
    "crates/aether-multiraft",
    "crates/aether-txn",
    "crates/aether-network",
    "crates/aether-server",
    "crates/aether-cli",
    "crates/aether-chaos",
    "crates/aether-bench",
    "crates/aether-cloud",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AetherDB Core Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1.38", features = ["full"] }
bytes = "1.6"
crossbeam = "0.8"
parking_lot = "0.12"
crc32fast = "1.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
tempfile = "3.10"
rand = "0.8"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
async-trait = "0.1"
