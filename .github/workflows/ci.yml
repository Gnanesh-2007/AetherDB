name: AetherDB CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  rust-workspace:
    name: Rust Workspace Tests & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Run Workspace Tests
        run: cargo test --workspace --verbose

  python-and-frameworks:
    name: Python SDK & AI Framework Integrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio langchain-core llama-index-core

      - name: Start AetherDB Server
        run: |
          cargo build --release --bin aether-server
          ./target/release/aether-server --addr 127.0.0.1:8300 --http-addr 127.0.0.1:8301 &
          sleep 3
          curl -f http://127.0.0.1:8301/health

      - name: Run Python SDK Tests
        run: pytest sdks/python/tests -v

      - name: Run LangChain Integration Tests
        run: pytest integrations/langchain/tests -v

      - name: Run LlamaIndex Integration Tests
        run: pytest integrations/llamaindex/tests -v

  javascript-and-demo:
    name: JavaScript SDK & Autonomous Agent Demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Start AetherDB Server
        run: |
          cargo build --release --bin aether-server
          ./target/release/aether-server --addr 127.0.0.1:8300 --http-addr 127.0.0.1:8301 &
          sleep 3
          curl -f http://127.0.0.1:8301/health

      - name: Run JS SDK Tests
        run: node sdks/js/test/sdk.test.js

      - name: Run Agent Demo Tests
        run: node --test demo/demo.test.js
