version: '3.8'

services:
  aetherdb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aetherdb
    ports:
      - "8300:8300"
      - "8301:8301"
    volumes:
      - aether_data:/data
    environment:
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8301/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s
    restart: unless-stopped

volumes:
  aether_data:
    driver: local
